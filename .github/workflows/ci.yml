# Created 2026.10.10
name: CI - Build and Test

# When does CI run?
# - On push to main or arena/* branches (my working branch is arena/...)
# - On pull requests to main
# This ensures every commit is tested before peer review / final submission

on:
  push:
    branches: [ main, "arena/*" ]
  pull_request:
    branches: [ main ]

jobs:
  # === Job 1: test - runs first ===
  # This job tests the current build (pytest 33 tests, PQC round-trip, imports)
  # It respects pyproject.toml + uv.lock + .python-version via uv
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        # Checks out code including pyproject.toml, uv.lock, .python-version, src/, tests/

      - name: Setup uv (respects .python-version and uv.lock)
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # uv reads .python-version file (3.13) automatically to select Python version
          # It also uses uv.lock for frozen dependencies

      - name: Setup Python from .python-version
        run: |
          uv python install
          uv python pin 3.13
          # Ensures Python 3.13 is installed, matching .python-version file and Dockerfile FROM python:3.13-slim

      - name: Sync dependencies from pyproject.toml + uv.lock (frozen)
        run: |
          uv sync --frozen
          # --frozen means use exact versions from uv.lock, don't update lock
          # This respects pyproject.toml dependencies (cryptography>=50.0.1, mlkem>=0.0.3)
          # and uv.lock locked versions (e.g., cffi 2.1.1, etc.)
          # For local dev you would run `uv sync` without --frozen
          # Install pytest as dev tool (not in uv.lock main deps, but in [dependency-groups].dev)
          uv pip install pytest

      - name: Run tests (33 tests) via uv
        run: |
          uv run pytest -v
          # Runs 33 tests: unit (legacy_device, gateway, security) + integration (TCP flow, failure robustness)
          # Previously 27 passed, 6 failed (gateway crash, no schema, no replay) - now 33 passed after hardening
          # This is the critical check before Docker build

      - name: Test PQC utils round-trip via uv
        run: |
          uv run python src/pqc_utils.py
          # Tests ML-KEM-512 keygen (pk 800B, sk 1632B), encaps (ss 32B, ct 768B), decaps, AES-GCM hybrid round-trip
          # Expected: Encrypted packet len ~845B, Round-trip OK

      - name: Check 3-tier imports via uv
        run: |
          uv run python -c "import src.pqc_utils; import src.edge_gateway; import src.cloud_service; print('imports ok')"
          # Ensures all three services can be imported after dependency sync

      - name: Verify pyproject.toml + uv.lock + .python-version consistency
        run: |
          cat .python-version
          cat pyproject.toml
          echo "uv.lock exists: $(ls -lh uv.lock)"
          # For peer review: shows that CI respects all three files

  # === Job 2: docker-build - runs AFTER test (needs: test) ===
  # How are parts linked?
  # - `needs: test` means docker-build only runs if test job succeeds (33 tests pass)
  # - This ensures we don't build Docker images if tests fail - fail fast
  # - Test block runs first, then docker-build block runs (sequential dependency)
  # - How does docker build work?
  #   - Dockerfile FROM python:3.13-slim (matches .python-version 3.13)
  #   - COPY pyproject.toml uv.lock .python-version README.md ./ (respects all three files)
  #   - RUN pip install uv && uv sync --frozen --no-install-project
  #     - Installs uv package manager inside container
  #     - Syncs dependencies from uv.lock frozen (same as CI), creates .venv with cryptography, mlkem locked versions
  #     - --no-install-project because package=false in pyproject.toml (no installable package, just deps)
  #   - ENV PATH="/app/.venv/bin:$PATH" ensures venv python is used
  #   - CMD ["python", "src/edge_gateway.py"] default, overridden in docker-compose for cloud
  # - How does this link to docker-compose file?
  #   - docker-compose.yml uses `build: .` which builds from same Dockerfile
  #   - So CI's docker build verification ensures docker-compose will also build correctly
  #   - docker-compose adds extra: services cloud and gateway, ports, volumes, healthchecks, depends_on
  #   - CI does NOT run docker-compose up (no need, just verifies images build)
  #   - For local deployment, you run `docker-compose up --build` which builds same Dockerfile and runs both services
  #   - Legacy device is an ephemeral client: in Docker, run on host `python src/legacy_device.py` which connects to host 5000 -> mapped to gateway container 5000
  #   - Or via `docker run --network host` to connect to gateway:5000 via Docker network
  docker-build:
    runs-on: ubuntu-latest
    needs: test  # Only runs if test job passes (33 tests)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker images (verify they respect pyproject.toml + uv.lock + .python-version)
        run: |
          docker build -t edge-gateway:test .
          docker build -t cloud-service:test .
          echo "Docker builds ok - they use pyproject.toml + uv.lock via uv sync --frozen"
          # This verifies Dockerfile works, which is same Dockerfile used by docker-compose.yml
          # docker-compose.yml is for local deployment simulation, not used in CI (CI just builds images)
          # For local: docker-compose up --build runs same Dockerfile for both cloud and gateway services
