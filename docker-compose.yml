# Minimal docker-compose for 3-tier simulation
# Simulates edge-cloud deployment locally (per course Q&A: entire pipeline is simulated, just code)
# No real cloud hosting needed, just local containers - code is the deliverable

# === Where do files come from and how are volumes used? ===
# 1. cloud_public_key.bin (800B):
#    - Generated by cloud_service.py on startup via pqc_utils.generate_keypair() -> writes to path from env CLOUD_PK_PATH
#    - For local run: ./cloud_public_key.bin in current dir, created at runtime, gitignored (*.bin)
#    #    - For Docker (old fragile way): bind mount ./cloud_public_key.bin:/app/cloud_public_key.bin
#    #      Problem: if host file doesn't exist before `docker-compose up`, Docker creates a DIRECTORY named cloud_public_key.bin
#    #      Then container tries to write file but finds directory -> "Is a directory" error
#    #    - For Docker (new robust way): use shared volume `pqc-shared` mounted at /app/shared in both containers
#    #      Cloud writes to /app/shared/cloud_public_key.bin inside shared volume
#    #      Gateway reads from same shared volume /app/shared/cloud_public_key.bin
#    #      Set env CLOUD_PK_PATH=/app/shared/cloud_public_key.bin in both services
#    #      This way host file doesn't need to exist beforehand, volume is managed by Docker
#    #      We keep both approaches documented: bind mount for local dev, shared volume for robust Docker
#
# 2. telemetry.db (SQLite):
#    - Created by cloud_service.py init_db() via sqlite3.connect("telemetry.db") on startup
#    - For local: ./telemetry.db in current dir, 12K initial, gitignored (*.db)
#    - For Docker: similar issue with file bind mount. Solutions:
#      - Option A: bind mount file but ensure `touch telemetry.db` before compose up
#      - Option B: use named volume for DB persistence
#      - Current: we use bind mount but with `touch` in entrypoint or ensure file exists; for simplicity we keep bind mount and document need to `touch` before up
#      - File contains table telemetry(id, device_id, timestamp, temperature, humidity, status, received_at, source_ip, pqc_decaps_ms, raw_json)
#      - Simple DB for peer review, no ORM
#
# 3. gateway_fallback.log:
#    - Created by edge_gateway.py forward_to_cloud() when pk missing or cloud unreachable
#    - Format: "<timestamp> <json>" per line, store-and-forward fallback for business continuity
#    - For local: ./gateway_fallback.log in current dir, gitignored (*.log)
#    - For Docker: bind mount ./gateway_fallback.log:/app/gateway_fallback.log, but same file-exists issue
#    - Solution: touch file before compose up, or use shared volume
#    - Current: bind mount, document need to touch
#
# 4. Sensor sending data to edge gateway:
#    - Legacy device is ephemeral client (not a long-running service in compose)
#    - For local: run `python src/legacy_device.py` on host, connects to 127.0.0.1:5000 which is mapped to gateway container's 5000 (ports: "5000:5000")
#    - For Docker: two options:
#      - Option A (simple, host): run legacy on host, connects to host's 5000 which forwards to gateway container
#      - Option B (container): `docker run --network host` or create a service `legacy` in compose that runs once and exits, connecting to gateway:5000 via Docker network
#    - For tests: tests use `running_gateway` fixture that starts gateway on ephemeral port via subprocess, not Docker, so tests don't depend on Docker
#    - So sensor data flow in Docker: [Host legacy_device.py] -> host 127.0.0.1:5000 -> Docker forwards to gateway container 5000 -> gateway decrypts, validates, PQC encaps -> forwards to cloud container via Docker network (CLOUD_HOST=cloud, CLOUD_PORT=6000) -> cloud decaps, stores in DB

services:
  cloud:
    build: .
    command: python src/cloud_service.py
    ports:
      - "6000:6000"   # data plane gateway->cloud PQC
      - "6001:6001"   # health/analytics - curl http://127.0.0.1:6001/health
    environment:
      # Use shared volume path for public key so gateway can read same file via shared volume
      - CLOUD_PK_PATH=/app/shared/cloud_public_key.bin
      - DB_PATH=/app/shared/telemetry.db
      - CLOUD_HOST=0.0.0.0
      - HEALTH_HOST=0.0.0.0
    volumes:
      # Robust shared volume for PQC public key and DB - managed by Docker, no need for host files to exist
      - pqc-shared:/app/shared
      # Optional bind mounts for local persistence (if you want DB file on host after container stops)
      # These are commented out to avoid file-exists issue, but you can uncomment if you `touch` files first:
      # - ./cloud_public_key.bin:/app/cloud_public_key.bin
      # - ./telemetry.db:/app/telemetry.db
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 6001))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  gateway:
    build: .
    command: python src/edge_gateway.py
    ports:
      - "5000:5000"   # legacy device -> gateway - legacy on host connects to 127.0.0.1:5000
      - "5001:5001"   # health/metrics - curl http://127.0.0.1:5001/health
    environment:
      # For Docker, gateway should connect to cloud service via Docker DNS name "cloud", not 127.0.0.1
      # 127.0.0.1 inside gateway container is gateway container itself, not cloud
      # So set CLOUD_HOST=cloud for Docker network
      - CLOUD_HOST=cloud
      - CLOUD_PORT=6000
      - CLOUD_PK_PATH=/app/shared/cloud_public_key.bin
      - FALLBACK_LOG=/app/shared/gateway_fallback.log
      - HEALTH_HOST=0.0.0.0
    depends_on:
      cloud:
        condition: service_healthy
    volumes:
      # Shared volume for public key, DB, fallback log - same volume as cloud
      - pqc-shared:/app/shared
      # Optional bind mounts for local persistence (touch files first):
      # - ./cloud_public_key.bin:/app/cloud_public_key.bin
      # - ./gateway_fallback.log:/app/gateway_fallback.log
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 5001))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

# Named volumes for robust file sharing (no need for host files to exist beforehand)
volumes:
  pqc-shared:
    driver: local

# === How to run ===
# 1. Ensure no leftover files cause directory creation issue:
#    rm -f cloud_public_key.bin telemetry.db gateway_fallback.log
#    mkdir -p shared  # if using old bind mount approach
#    touch telemetry.db gateway_fallback.log  # if using bind mounts
# 2. docker-compose up --build
# 3. In another terminal, run legacy device on host (connects to host 5000 -> gateway container):
#    python src/legacy_device.py
#    # or via Docker: docker run --rm --network host -v $(pwd)/src:/app/src python:3.13-slim python /app/src/legacy_device.py
# 4. Check health:
#    curl http://127.0.0.1:5001/health  # gateway metrics
#    curl http://127.0.0.1:6001/health  # cloud db_rows, analytics, pqc metrics
# 5. Check DB (if bind mounted or via docker exec):
#    docker exec $(docker ps -q -f name=cloud) cat /app/shared/telemetry.db | sqlite3 - or via volume inspect
#    # For local bind mount: sqlite3 telemetry.db "SELECT * FROM telemetry;"
